# Gestão de dependências com Poetry, esperada a partir do Nível 1.
# Ajuste as dependências conforme a sua abordagem (HTTP puro ou navegador).
# Uso:
#   poetry install
#   poetry run python -m kwai_collector --help
#   poetry run pytest

[tool.poetry]
name = "kwai-collector"
version = "0.1.0"
description = "Coletor de postagens, engajamento e comentarios do Kwai (Desafio VoxRadar)"
authors = ["Seu Nome <voce@exemplo.com>"]
readme = "README.md"
packages = [{ include = "kwai_collector" }]

[tool.poetry.dependencies]
python = "^3.11"
# Escolha a sua abordagem de acesso (descomente o que usar):
# httpx = "^0.27"
# requests = "^2.32"
# playwright = "^1.45"
# selenium = "^4.22"
# Parsing / dados:
# beautifulsoup4 = "^4.12"
# pydantic = "^2.8"
# pydantic-settings = "^2.3"
# CLI:
# typer = "^0.12"

[tool.poetry.group.dev.dependencies]
# Ferramentas de qualidade esperadas a partir do Nível 1:
# pytest = "^8.2"
# pytest-cov = "^5.0"
# mypy = "^1.10"
# ruff = "^0.5"

# Ponto de entrada opcional da CLI:
# [tool.poetry.scripts]
# kwai-collector = "kwai_collector.__main__:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
